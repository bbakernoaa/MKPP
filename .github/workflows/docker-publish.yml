name: Publish CI Docker Image

on:
  push:
    branches: ["main", "develop", "feature/*", "feature/**"]
    paths:
      - '.github/docker/Dockerfile.ci'
      - 'environment.yml'
      - 'pyproject.toml'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    paths:
      - '.github/docker/Dockerfile.ci'
      - 'environment.yml'
      - 'pyproject.toml'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Org-owned namespace so the workflow's GITHUB_TOKEN (packages:write) can
  # actually push: the token is only valid for packages owned by this repo's
  # organization, not a personal namespace like bbakernoaa.
  # GHCR identifiers must be lowercase.
  IMAGE_NAME: noaa-emc/mkpp-ci-env

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/docker/Dockerfile.ci
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
