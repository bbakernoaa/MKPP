name: MKPP CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  static-gates:
    name: 1. Static Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pre-commit
        run: pip install pre-commit

      - name: Run Pre-commit Hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Validate Semantic Versioning (SemVer)
        run: |
          python -c "
          import re, sys, tomllib
          from pathlib import Path

          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)

          version = data.get('project', {}).get('version', '')
          semver_regex = r'^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'

          if not re.match(semver_regex, version):
              print(f'::error::Version \"{version}\" in pyproject.toml is not a valid Semantic Version (SemVer 2.0.0)')
              sys.exit(1)

          print(f'✓ Version \"{version}\" in pyproject.toml is a valid Semantic Version')
          "

      - name: Validate Conventional Commits (PR Title)
        if: github.event_name == 'pull_request'
        run: |
          python -c "
          import re, sys

          pr_title = '''${{ github.event.pull_request.title }}'''
          print(f'Checking PR Title: {pr_title}')

          conv_commit_regex = r'^(feat|fix|perf|refactor|test|docs|ci|chore|build|revert)(\([a-zA-Z0-9_.-]+\))?!?: .+$'

          if not re.match(conv_commit_regex, pr_title):
              print(f'::error::PR title \"{pr_title}\" does not follow Conventional Commits specification.')
              print('::error::Format must be: <type>(<scope>): <description>')
              print('::error::Allowed types: feat, fix, perf, refactor, test, docs, ci, chore, build, revert')
              sys.exit(1)

          print('✓ PR title complies with Conventional Commits specification')
          "

  env-setup:
    name: 2. Environment & Dependency Setup
    needs: static-gates
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Conda Environment
        id: cache-conda
        uses: actions/cache@v4
        with:
          path: /usr/share/miniconda/envs/mkpp-env
          key: conda-env-${{ runner.os }}-${{ hashFiles('environment.yml') }}

      - name: Setup Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: mkpp-env
          environment-file: environment.yml
          auto-activate-base: false

      - name: Cache Kokkos Installation
        id: cache-kokkos
        uses: actions/cache@v4
        with:
          path: /opt/kokkos
          key: kokkos-4.5.01-serial-${{ runner.os }}-gcc

      - name: Build Kokkos from Source
        if: steps.cache-kokkos.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 4.5.01 https://github.com/kokkos/kokkos.git /tmp/kokkos-src
          cmake -S /tmp/kokkos-src -B /tmp/kokkos-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/kokkos \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_OPENMP=OFF \
            -DKokkos_ENABLE_CUDA=OFF
          cmake --build /tmp/kokkos-build -j $(nproc)
          cmake --install /tmp/kokkos-build

      - name: Validate Environment (EE2 Compliance)
        run: |
          echo "Checking compilers and environment..."
          python --version
          cmake --version
          ninja --version
          echo "Kokkos installed at /opt/kokkos"
          ls /opt/kokkos/lib*/cmake/Kokkos/ || ls /opt/kokkos/lib/cmake/Kokkos/

  aot-codegen:
    name: 3. AOT Codegen & Freshness Gate
    needs: env-setup
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Conda Environment
        id: cache-conda
        uses: actions/cache@v4
        with:
          path: /usr/share/miniconda/envs/mkpp-env
          key: conda-env-${{ runner.os }}-${{ hashFiles('environment.yml') }}

      - name: Setup Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: mkpp-env
          auto-activate-base: false

      - name: Install MKPP Package
        run: pip install -e .

      - name: Regenerate C++ Headers (AOT Compilation)
        run: |
          python -c "
          from mkpp.parser import load_mechanism
          from mkpp.codegen import generate_headers
          import os

          out_dir = 'mkpp-generated'
          os.makedirs(out_dir, exist_ok=True)

          mechanisms = [
              'mechanisms/chapman.yaml',
              'mechanisms/small_strato.yaml',
              'mechanisms/gocart.yaml',
              'mechanisms/carbon.yaml',
              'mechanisms/saprc99.yaml',
              'mechanisms/saprcnov.yaml',
              'mechanisms/t1.yaml',
          ]
          for mech_file in mechanisms:
              if os.path.exists(mech_file):
                  mech = load_mechanism(mech_file)
                  generate_headers(mech, out_dir=out_dir, solver_name='ros3')
                  print(f'  Generated {mech.name}.hpp')
          "

      - name: Verify Committed Headers Are Up-to-Date
        run: |
          if ! git diff --quiet mkpp-generated/*.hpp; then
            echo "::error::Committed headers in mkpp-generated/ are stale. Please regenerate locally:"
            echo "::error::  python -c \"from mkpp.parser import load_mechanism; from mkpp.codegen import generate_headers; ...\""
            echo ""
            echo "Changed files:"
            git diff --stat mkpp-generated/*.hpp
            echo ""
            echo "Run 'mkpp compile' or the regeneration script, then commit the updated headers."
            exit 1
          fi
          echo "✓ mkpp-generated/ headers are up-to-date with codegen"

  build-cpp:
    name: 4. C++ Core Build
    needs: aot-codegen
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Conda Environment
        id: cache-conda
        uses: actions/cache@v4
        with:
          path: /usr/share/miniconda/envs/mkpp-env
          key: conda-env-${{ runner.os }}-${{ hashFiles('environment.yml') }}

      - name: Setup Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: mkpp-env
          auto-activate-base: false

      - name: Cache Kokkos Installation
        id: cache-kokkos
        uses: actions/cache@v4
        with:
          path: /opt/kokkos
          key: kokkos-4.5.01-serial-${{ runner.os }}-gcc

      - name: Configure CMake
        run: cmake --preset default -DKokkos_ROOT=/opt/kokkos

      - name: Build C++ Core
        run: cmake --build --preset default

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmake-build-dir
          path: build/
          retention-days: 1

  test-gates:
    name: 5. Test Gates
    needs: build-cpp
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Conda Environment
        id: cache-conda
        uses: actions/cache@v4
        with:
          path: /usr/share/miniconda/envs/mkpp-env
          key: conda-env-${{ runner.os }}-${{ hashFiles('environment.yml') }}

      - name: Setup Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: mkpp-env
          auto-activate-base: false

      - name: Cache Kokkos Installation
        id: cache-kokkos
        uses: actions/cache@v4
        with:
          path: /opt/kokkos
          key: kokkos-4.5.01-serial-${{ runner.os }}-gcc

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cmake-build-dir
          path: build/

      - name: Ensure Executable Permissions
        run: chmod +x build/bin/* build/tests/integration/e2e_validation/* 2>/dev/null || true

      - name: Run C++ CTests
        run: ctest --preset default --output-on-failure

      - name: Install MKPP Package
        run: pip install -e .

      - name: Run Python AOT Tests
        run: pytest tests/python/ -ra -q --strict-markers
