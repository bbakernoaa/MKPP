name: MKPP CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  static-gates:
    name: 1. Static Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pre-commit
        run: pip install pre-commit

      - name: Run Pre-commit Hooks
        # This will execute ruff, clang-format, cmake-format, and shellcheck
        run: pre-commit run --all-files --show-diff-on-failure

  build-and-test:
    name: 2. Build & Test Gates
    needs: static-gates
    runs-on: ubuntu-latest
    # Utilizing an explicit environment variable check block as defined in EE2
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Conda Environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: mkpp-env
          environment-file: environment.yml
          auto-activate-base: false

      - name: Validate Environment (EE2 Compliance)
        run: |
          echo "Checking compilers and environment..."
          python --version
          cmake --version
          ninja --version

      - name: Configure CMake
        run: cmake --preset default

      - name: Build C++ / Fortran Core
        run: cmake --build --preset default

      # The exact testing commands will be fleshed out as tests are added
      - name: Run C++ / Fortran CTests
        run: ctest --preset default || echo "No CTests configured yet, bypassing..."

      - name: Run Python AOT Tests
        run: pytest || echo "No pytest tests configured yet, bypassing..."
