[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "build", "dist", "venv", ".venv"]

[tool.ruff.lint]
# E: pycodestyle errors
# F: Pyflakes
# I: isort (import sorting)
# UP: pyupgrade
# N: pep8-naming
select = ["E", "F", "I", "UP", "N"]

# Ignore certain naming rules that conflict with standard mathematical notation.
# e.g., We want to allow matrices to be uppercase (like `J_block`, `C`, `E_matrix`) 
# and constants to be uppercase.
ignore = ["N806", "N803"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests/python",
]
