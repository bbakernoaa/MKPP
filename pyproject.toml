[project]
name = "mkpp"
version = "0.1.0"
description = "Multiphase KPP (MKPP) Engine"
authors = [
    { name = "Barry Baker", email = "barry.baker@noaa.gov" }
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0,<7",
    "sympy>=1.12,<2",
    "jinja2>=3.1,<4",
    "networkx>=3.1,<4"
]

[project.scripts]
mkpp = "mkpp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["mkpp"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "build", "dist", "venv", ".venv"]

[tool.ruff.lint]
# E: pycodestyle errors
# F: Pyflakes
# I: isort (import sorting)
# UP: pyupgrade
# N: pep8-naming
select = ["E", "F", "I", "UP", "N"]

# Ignore certain naming rules that conflict with standard mathematical notation.
# e.g., We want to allow matrices to be uppercase (like `J_block`, `C`, `E_matrix`)
# and constants to be uppercase.
ignore = ["N806", "N803"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests/python",
]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
